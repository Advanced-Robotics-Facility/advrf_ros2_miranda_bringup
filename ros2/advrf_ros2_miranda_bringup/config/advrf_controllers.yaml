# Mode, IDs, gains and limits come from robot_config.yaml.
/**/joint_command_controller_node:
  ros__parameters:
    command_durability: volatile
/**/motor_power_node:
  ros__parameters:
    auto_start_motors: false
    motor_service_timeout: 3.0
/**/joint_trajectory_controller_node:
  ros__parameters:
    command_enabled: true
    update_rate: 250.0
    feedback_timeout: 0.2
    path_tolerance: 0.1
    goal_tolerance: 0.02
    goal_time_tolerance: 2.0
/**/joint_go_to_node:
  ros__parameters:
    feedback_timeout: 0.2
    response_timeout: 5.0
    goal_time_tolerance: 2.0
    start_velocity_tolerance: 0.01
