# ROS bridge only. EtherCAT client configuration stays in ec_cfg.yaml.
/**/bridge_ecat_client_node:
  ros__parameters:
    period_ms: 5
    read_only: false
    qos:
      state:
        depth: 10
        reliability: reliable
        durability: volatile
      command:
        depth: 1
        reliability: best_effort
        durability: volatile
